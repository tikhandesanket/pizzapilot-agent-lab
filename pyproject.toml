
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pizzapilot"
version = "0.1.0"
description = "A hands-on Python agent engineering learning project"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/pizzapilot"]